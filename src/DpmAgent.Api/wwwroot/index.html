<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DPM Agent</title>
  <script src="i18n.js"></script>
  <script src="accesibilidad.js"></script>
  <style>
    :root { --bg:#f4f6f8; --card:#fff; --text:#1d2430; --muted:#4f5864; --brand:#0f7b6c; --on-brand:#fff; --me:#dcf5ee; --line:#c9d1d9; --aviso:#fff4d6; --aviso-borde:#b8902a; --foco:#1d4ed8; --err:#b42318; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#12161b; --card:#1b2129; --text:#e6e9ed; --muted:#aeb7c1; --brand:#3fbfa8; --on-brand:#062a24; --me:#1f3b35; --line:#3a434e; --aviso:#3a3220; --aviso-borde:#8a7232; --foco:#93c5fd; --err:#ff8a7a; }
    }
    * { box-sizing:border-box; }
    body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); }
    .banner { background:var(--aviso); border-bottom:1px solid var(--aviso-borde); padding:8px 16px; font-size:0.875rem; display:flex; gap:12px; align-items:center; justify-content:center; flex-wrap:wrap; }
    .barra { max-width:1100px; margin:0 auto; padding:12px 16px 0; display:flex; justify-content:flex-end; gap:8px; align-items:center; font-size:0.8125rem; color:var(--muted); }
    main { max-width:1100px; margin:0 auto; padding:16px; display:grid; gap:16px; grid-template-columns:1fr; }
    @media (min-width:900px) { main { grid-template-columns:3fr 2fr; } }
    section { background:var(--card); border:1px solid var(--line); border-radius:12px; display:flex; flex-direction:column; min-height:0; }
    header { padding:12px 16px; border-bottom:1px solid var(--line); }
    header h1, header h2 { margin:0; font-size:1rem; }
    header p { margin:4px 0 0; color:var(--muted); font-size:0.8125rem; }
    #ejemplos { padding:10px 16px; border-bottom:1px solid var(--line); display:flex; flex-wrap:wrap; gap:6px; align-items:center; font-size:0.8125rem; }
    #notaDemo { margin:0; padding:8px 16px; border-bottom:1px solid var(--line); font-size:0.8125rem; color:var(--muted); background:var(--aviso); }
    .banner a { color:inherit; }
    #ejemplos button { background:transparent; color:var(--text); border:1px solid var(--line); padding:6px 10px; font-weight:500; font-size:0.8125rem; }
    #ejemplos a { margin-left:auto; color:var(--brand); font-size:0.8125rem; }
    #chat { height:56vh; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:8px; }
    .msg { max-width:85%; padding:8px 12px; border-radius:10px; white-space:pre-wrap; line-height:1.4; font-size:0.875rem; }
    .user { align-self:flex-end; background:var(--me); }
    .bot { align-self:flex-start; background:var(--bg); }
    .err { align-self:center; color:var(--err); font-size:0.8125rem; }
    .canal { display:flex; gap:8px; align-items:center; padding:8px 16px; border-bottom:1px solid var(--line); font-size:0.8125rem; color:var(--muted); flex-wrap:wrap; }
    .canal input { flex:0 1 160px; padding:6px 8px; }
    #idiomaPaciente { margin-left:auto; }
    form { display:flex; gap:8px; padding:12px; border-top:1px solid var(--line); }
    input, select { padding:10px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--text); font-size:0.875rem; }
    form input { flex:1; min-width:0; }
    select { padding:6px 8px; }
    button { padding:10px 16px; border:0; border-radius:8px; background:var(--brand); color:var(--on-brand); font-weight:600; cursor:pointer; }
    button:disabled { opacity:.5; }
    button.sec { background:transparent; color:var(--text); border:1px solid var(--line); padding:6px 10px; font-weight:600; }
    #grabar.activo { background:var(--err); color:var(--on-brand); }
    a { color:var(--brand); }
    :focus-visible { outline:3px solid var(--foco); outline-offset:2px; }
    .solo-lector { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
    .voz { font-size:0.75rem; color:var(--muted); display:block; margin-bottom:2px; }
    #trace { height:56vh; overflow-y:auto; padding:12px 16px; font-family:ui-monospace,Consolas,monospace; font-size:0.75rem; }
    .step { border-left:3px solid var(--brand); padding:4px 8px; margin-bottom:10px; }
    .step b { color:var(--brand); }
    .step pre { margin:4px 0 0; white-space:pre-wrap; word-break:break-word; color:var(--muted); }
  </style>
</head>
<body>
<div id="banner" class="banner" hidden>
  <strong data-i18n="demo.banner"></strong>
  <span id="panelDemo" hidden><a href="panel.html" data-i18n="demo.panel"></a>: <code id="credencialesDemo"></code></span>
  <button id="reiniciar" type="button" data-i18n="demo.reiniciar"></button>
</div>
<div class="barra">
  <button id="tamanoLetra" type="button" class="sec">A+</button>
  <label for="selectorIdioma" data-i18n="idioma"></label>
  <select id="selectorIdioma" data-selector-idioma></select>
</div>
<main>
  <section>
    <header>
      <h1 data-i18n="chat.titulo"></h1>
      <p><span data-i18n="chat.subtitulo"></span> <a href="privacidad.html" data-i18n="priv.enlace"></a></p>
    </header>
    <div id="ejemplos" hidden><span data-i18n="demo.probar"></span><a id="carnetDemo" href="demo/carnet-ficticio.png" download data-i18n="demo.carnet"></a></div>
    <p id="notaDemo" hidden></p>
    <div class="canal">
      <label for="telefono" data-i18n="chat.telefono"></label>
      <input id="telefono" value="809-555-0101" autocomplete="off">
      <button id="nueva" type="button" data-i18n="chat.nueva"></button>
      <span id="idiomaPaciente"></span>
    </div>
    <div id="chat" role="log" aria-live="polite" tabindex="0" data-i18n-aria="chat.conversacion"></div>
    <form id="form">
      <input id="input" autocomplete="off" data-i18n-placeholder="chat.placeholder" data-i18n-aria="chat.mensaje">
      <button id="foto" type="button" data-i18n-title="chat.foto" data-i18n-aria="chat.foto">📷</button>
      <input id="archivoFoto" type="file" accept="image/jpeg,image/png,image/webp" hidden>
      <button id="grabar" type="button" data-i18n-title="chat.grabar" data-i18n-aria="chat.grabar">🎤</button>
      <button id="send" data-i18n="chat.enviar"></button>
    </form>
  </section>
  <section>
    <header>
      <h2 data-i18n="traza.titulo"></h2>
      <p data-i18n="traza.subtitulo"></p>
    </header>
    <div id="trace" role="region" tabindex="0" data-i18n-aria="traza.titulo"></div>
  </section>
</main>
<script>
  const t = (clave) => I18N.t(clave);
  const chat = document.getElementById('chat');
  const trace = document.getElementById('trace');
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const send = document.getElementById('send');
  const telefono = document.getElementById('telefono');
  const idiomaPaciente = document.getElementById('idiomaPaciente');
  let sesionId = null;
  let ultimoSaliente = 0;

  function nuevaConversacion() {
    sesionId = null;
    ultimoSaliente = 0;
    telefono.disabled = false;
    idiomaPaciente.textContent = '';
    chat.replaceChildren();
    trace.replaceChildren();
  }

  document.getElementById('nueva').addEventListener('click', nuevaConversacion);

  function add(cls, text, etiqueta) {
    const div = document.createElement('div');
    div.className = 'msg ' + cls;
    if (etiqueta) {
      const small = document.createElement('small');
      small.className = 'voz';
      small.textContent = etiqueta;
      div.appendChild(small);
    }
    div.appendChild(document.createTextNode(text));
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  function addStep(p) {
    const div = document.createElement('div');
    div.className = 'step';
    const b = document.createElement('b');
    b.textContent = p.herramienta;
    const pre = document.createElement('pre');
    pre.textContent = 'args: ' + p.argumentos + '\n→ ' + p.resultado;
    div.append(b, pre);
    trace.appendChild(div);
    trace.scrollTop = trace.scrollHeight;
  }

  function mostrarRespuesta(data) {
    sesionId = data.sesionId;
    // Una sesión queda atada a su número, igual que un chat de WhatsApp.
    telefono.disabled = true;
    if (data.idioma) idiomaPaciente.textContent = `${t('chat.idioma_detectado')}: ${data.idioma}`;
    (data.pasos || []).forEach(addStep);
    add('bot', data.respuesta);
  }

  async function leerError(res) {
    try {
      const data = await res.json();
      return data.detail || data.error || res.statusText;
    } catch {
      return res.statusText;
    }
  }

  // En la demo cada número tiene una conversación fija ("demo-" + número): así la oferta automática
  // de un turno liberado aparece al escribir con el número de quien está en la lista de espera.
  function asegurarSesion() {
    if (sesionId || !demo) return;
    const digitos = telefono.value.replace(/\D/g, '');
    if (digitos.length >= 7) sesionId = 'demo-' + digitos.slice(-10);
  }

  async function enviarTexto(mensaje) {
    asegurarSesion();
    add('user', mensaje);
    send.disabled = true;
    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sesionId, mensaje, telefono: telefono.value.trim() || null, idioma: I18N.idioma })
      });
      if (!res.ok) throw new Error(await leerError(res));
      mostrarRespuesta(await res.json());
    } catch (err) {
      add('err', t('chat.error') + err.message);
    } finally {
      send.disabled = false;
      input.focus();
    }
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const mensaje = input.value.trim();
    if (!mensaje) return;
    input.value = '';
    await enviarTexto(mensaje);
  });

  // Mensajes que el sistema envía solo (ofertas de turnos liberados, recordatorios).
  async function revisarSalientes() {
    if (!sesionId) return;
    try {
      const res = await fetch(`/api/chat/${encodeURIComponent(sesionId)}/salientes?despuesDe=${ultimoSaliente}`);
      if (!res.ok) return;
      for (const m of await res.json()) {
        ultimoSaliente = Math.max(ultimoSaliente, m.id);
        add('bot', m.texto, m.tipo === 'recordatorio' ? t('chat.recordatorio') : t('chat.automatico'));
      }
    } catch {
      // Sin conexión: se intenta en la siguiente vuelta.
    }
  }
  setInterval(revisarSalientes, 5000);

  // Foto del carnet de la ARS: se lee, queda pendiente y el agente pide confirmación.
  const foto = document.getElementById('foto');
  const archivoFoto = document.getElementById('archivoFoto');
  foto.addEventListener('click', () => archivoFoto.click());
  archivoFoto.addEventListener('change', async () => {
    const archivo = archivoFoto.files[0];
    archivoFoto.value = '';
    if (!archivo) return;
    add('user', archivo.name, t('chat.foto_carnet'));
    send.disabled = foto.disabled = true;
    try {
      const res = await fetch('/api/pacientes/carnet', { method: 'POST', body: formulario('imagen', archivo) });
      if (!res.ok) throw new Error(await leerError(res));
      mostrarRespuesta(await res.json());
    } catch (err) {
      add('err', t('chat.error') + err.message);
    } finally {
      send.disabled = foto.disabled = false;
    }
  });

  function formulario(campo, archivo) {
    asegurarSesion();
    const datos = new FormData();
    datos.append(campo, archivo, archivo.name || 'archivo');
    if (sesionId) datos.append('sesionId', sesionId);
    if (telefono.value.trim()) datos.append('telefono', telefono.value.trim());
    datos.append('idioma', I18N.idioma);
    return datos;
  }

  // Notas de voz: se graban en el navegador y se envían a /api/chat/audio.
  const grabar = document.getElementById('grabar');
  const MAX_SEGUNDOS = 120;
  let grabadora = null;
  let corte = null;

  function formatoGrabacion() {
    const opciones = ['audio/ogg;codecs=opus', 'audio/webm;codecs=opus', 'audio/webm', 'audio/mp4'];
    return opciones.find(x => window.MediaRecorder && MediaRecorder.isTypeSupported(x)) || '';
  }

  if (!navigator.mediaDevices || !window.MediaRecorder) {
    grabar.disabled = true;
    grabar.dataset.i18nTitle = 'chat.sin_microfono';
  }

  grabar.addEventListener('click', async () => {
    if (grabadora) {
      grabadora.stop();
      return;
    }
    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (err) {
      add('err', t('chat.error_microfono') + err.message);
      return;
    }
    const partes = [];
    const tipo = formatoGrabacion();
    grabadora = new MediaRecorder(stream, tipo ? { mimeType: tipo } : undefined);
    grabadora.ondataavailable = (e) => { if (e.data.size) partes.push(e.data); };
    grabadora.onstop = async () => {
      clearTimeout(corte);
      stream.getTracks().forEach(x => x.stop());
      const blob = new Blob(partes, { type: grabadora.mimeType });
      grabadora = null;
      grabar.classList.remove('activo');
      grabar.textContent = '🎤';
      await enviarAudio(blob);
    };
    grabadora.start();
    grabar.classList.add('activo');
    grabar.textContent = '■';
    corte = setTimeout(() => grabadora && grabadora.stop(), MAX_SEGUNDOS * 1000);
  });

  async function enviarAudio(blob) {
    if (!blob.size) return;
    const pendiente = add('user', '…', t('chat.nota_voz'));
    send.disabled = grabar.disabled = true;
    try {
      const res = await fetch('/api/chat/audio', { method: 'POST', body: formulario('audio', blob) });
      if (!res.ok) throw new Error(await leerError(res));
      const data = await res.json();
      pendiente.lastChild.textContent = data.transcripcion;
      mostrarRespuesta(data);
    } catch (err) {
      pendiente.lastChild.textContent = t('chat.no_procesado');
      add('err', t('chat.error') + err.message);
    } finally {
      send.disabled = grabar.disabled = false;
    }
  }

  // Modo demo: banner, reinicio y ejemplos para probar en 30 segundos.
  let demo = null;

  let notaActual = null;

  function pintarNota() {
    const p = document.getElementById('notaDemo');
    const texto = notaActual && (notaActual[I18N.idioma] || notaActual.en);
    p.hidden = !texto;
    p.textContent = texto || '';
  }

  function pintarEjemplos() {
    pintarNota();
    const caja = document.getElementById('ejemplos');
    caja.querySelectorAll('button').forEach(b => b.remove());
    if (!demo) return;
    for (const ej of demo.ejemplos) {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = ej.etiqueta[I18N.idioma] || ej.etiqueta.en;
      b.addEventListener('click', async () => {
        if (ej.telefono !== telefono.value.trim() || telefono.disabled) {
          nuevaConversacion();
          telefono.value = ej.telefono;
        }
        notaActual = ej.nota || null;
        pintarNota();
        await enviarTexto(ej.mensaje[I18N.idioma] || ej.mensaje.en);
      });
      caja.insertBefore(b, document.getElementById('carnetDemo'));
    }
  }

  async function cargarDemo() {
    try {
      const res = await fetch('/api/demo');
      if (!res.ok) return;
      demo = await res.json();
      if (!demo.habilitado) { demo = null; return; }
      document.getElementById('banner').hidden = false;
      document.getElementById('ejemplos').hidden = false;
      if (demo.usuarioPanel) {
        document.getElementById('panelDemo').hidden = false;
        document.getElementById('credencialesDemo').textContent = `${demo.usuarioPanel} / ${demo.clavePanel}`;
      }
      pintarEjemplos();
    } catch {
      demo = null;
    }
  }

  document.getElementById('reiniciar').addEventListener('click', async () => {
    const res = await fetch('/api/demo/reiniciar', { method: 'POST' });
    nuevaConversacion();
    notaActual = null;
    pintarNota();
    add(res.ok ? 'bot' : 'err', res.ok ? t('demo.reiniciada') : t('chat.error') + await leerError(res));
  });

  I18N.alCambiar(pintarEjemplos);
  cargarDemo();
</script>
</body>
</html>
