<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DPM Agent</title>
  <style>
    :root { --bg:#f4f6f8; --card:#fff; --text:#1d2430; --muted:#6b7480; --brand:#0f7b6c; --me:#dcf5ee; --line:#e3e7eb; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#12161b; --card:#1b2129; --text:#e6e9ed; --muted:#9aa3ad; --brand:#3fbfa8; --me:#1f3b35; --line:#2a313a; }
    }
    * { box-sizing:border-box; }
    body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); }
    main { max-width:1100px; margin:0 auto; padding:16px; display:grid; gap:16px; grid-template-columns:1fr; }
    @media (min-width:900px) { main { grid-template-columns:3fr 2fr; } }
    section { background:var(--card); border:1px solid var(--line); border-radius:12px; display:flex; flex-direction:column; min-height:0; }
    header { padding:12px 16px; border-bottom:1px solid var(--line); }
    header h1, header h2 { margin:0; font-size:16px; }
    header p { margin:4px 0 0; color:var(--muted); font-size:13px; }
    #chat { height:60vh; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:8px; }
    .msg { max-width:85%; padding:8px 12px; border-radius:10px; white-space:pre-wrap; line-height:1.4; font-size:14px; }
    .user { align-self:flex-end; background:var(--me); }
    .bot { align-self:flex-start; background:var(--bg); }
    .err { align-self:center; color:#c0392b; font-size:13px; }
    .canal { display:flex; gap:8px; align-items:center; padding:8px 16px; border-bottom:1px solid var(--line); font-size:13px; color:var(--muted); }
    .canal input { flex:0 1 180px; padding:6px 8px; }
    form { display:flex; gap:8px; padding:12px; border-top:1px solid var(--line); }
    input { flex:1; padding:10px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--text); font-size:14px; }
    button { padding:10px 16px; border:0; border-radius:8px; background:var(--brand); color:#fff; font-weight:600; cursor:pointer; }
    button:disabled { opacity:.5; }
    #grabar.activo { background:#c0392b; }
    .voz { font-size:12px; color:var(--muted); display:block; margin-bottom:2px; }
    #trace { height:60vh; overflow-y:auto; padding:12px 16px; font-family:ui-monospace,Consolas,monospace; font-size:12px; }
    .step { border-left:3px solid var(--brand); padding:4px 8px; margin-bottom:10px; }
    .step b { color:var(--brand); }
    .step pre { margin:4px 0 0; white-space:pre-wrap; word-break:break-word; color:var(--muted); }
  </style>
</head>
<body>
<main>
  <section>
    <header>
      <h1>DPM Agent: recepción del consultorio</h1>
      <p>Prototipo con datos ficticios. Solo tareas administrativas, sin orientación médica.</p>
    </header>
    <div class="canal">
      <label for="telefono">Número de WhatsApp (simulado):</label>
      <input id="telefono" value="809-555-0101" autocomplete="off">
      <button id="nueva" type="button">Nueva conversación</button>
    </div>
    <div id="chat"></div>
    <form id="form">
      <input id="input" autocomplete="off" placeholder="Ej.: Quiero una cita con la doctora para mañana en la mañana">
      <button id="foto" type="button" title="Enviar foto del carnet de la ARS">📷</button>
      <input id="archivoFoto" type="file" accept="image/jpeg,image/png,image/webp" hidden>
      <button id="grabar" type="button" title="Grabar nota de voz">🎤</button>
      <button id="send">Enviar</button>
    </form>
  </section>
  <section>
    <header>
      <h2>Pasos del agente</h2>
      <p>Herramientas que el modelo decidió usar en cada turno.</p>
    </header>
    <div id="trace"></div>
  </section>
</main>
<script>
  const chat = document.getElementById('chat');
  const trace = document.getElementById('trace');
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const send = document.getElementById('send');
  const telefono = document.getElementById('telefono');
  let sesionId = null;

  document.getElementById('nueva').addEventListener('click', () => {
    sesionId = null;
    telefono.disabled = false;
    chat.replaceChildren();
    trace.replaceChildren();
  });

  function add(cls, text, etiqueta) {
    const div = document.createElement('div');
    div.className = 'msg ' + cls;
    if (etiqueta) {
      const small = document.createElement('small');
      small.className = 'voz';
      small.textContent = etiqueta;
      div.appendChild(small);
    }
    div.appendChild(document.createTextNode(text));
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  function mostrarRespuesta(data) {
    sesionId = data.sesionId;
    // Una sesión queda atada a su número, igual que un chat de WhatsApp.
    telefono.disabled = true;
    (data.pasos || []).forEach(addStep);
    add('bot', data.respuesta);
  }

  async function leerError(res) {
    try {
      const data = await res.json();
      return data.detail || data.error || res.statusText;
    } catch {
      return res.statusText;
    }
  }

  function addStep(p) {
    const div = document.createElement('div');
    div.className = 'step';
    const b = document.createElement('b');
    b.textContent = p.herramienta;
    const pre = document.createElement('pre');
    pre.textContent = 'args: ' + p.argumentos + '\n→ ' + p.resultado;
    div.append(b, pre);
    trace.appendChild(div);
    trace.scrollTop = trace.scrollHeight;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const mensaje = input.value.trim();
    if (!mensaje) return;
    add('user', mensaje);
    input.value = '';
    send.disabled = true;
    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sesionId, mensaje, telefono: telefono.value.trim() || null })
      });
      if (!res.ok) throw new Error(await leerError(res));
      mostrarRespuesta(await res.json());
    } catch (err) {
      add('err', 'Error: ' + err.message);
    } finally {
      send.disabled = false;
      input.focus();
    }
  });

  // Foto del carnet de la ARS: se lee, queda pendiente y el agente pide confirmación.
  const foto = document.getElementById('foto');
  const archivoFoto = document.getElementById('archivoFoto');
  foto.addEventListener('click', () => archivoFoto.click());
  archivoFoto.addEventListener('change', async () => {
    const archivo = archivoFoto.files[0];
    archivoFoto.value = '';
    if (!archivo) return;
    add('user', archivo.name, '📷 Foto del carnet');
    send.disabled = foto.disabled = true;
    try {
      const datos = new FormData();
      datos.append('imagen', archivo);
      if (sesionId) datos.append('sesionId', sesionId);
      if (telefono.value.trim()) datos.append('telefono', telefono.value.trim());
      const res = await fetch('/api/pacientes/carnet', { method: 'POST', body: datos });
      if (!res.ok) throw new Error(await leerError(res));
      mostrarRespuesta(await res.json());
    } catch (err) {
      add('err', 'Error: ' + err.message);
    } finally {
      send.disabled = foto.disabled = false;
    }
  });

  // Notas de voz: se graban en el navegador y se envían a /api/chat/audio.
  const grabar = document.getElementById('grabar');
  const MAX_SEGUNDOS = 120;
  let grabadora = null;
  let corte = null;

  function formatoGrabacion() {
    const opciones = ['audio/ogg;codecs=opus', 'audio/webm;codecs=opus', 'audio/webm', 'audio/mp4'];
    return opciones.find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || '';
  }

  if (!navigator.mediaDevices || !window.MediaRecorder) {
    grabar.disabled = true;
    grabar.title = 'Este navegador no permite grabar audio';
  }

  grabar.addEventListener('click', async () => {
    if (grabadora) {
      grabadora.stop();
      return;
    }
    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (err) {
      add('err', 'No se pudo usar el micrófono: ' + err.message);
      return;
    }
    const partes = [];
    const tipo = formatoGrabacion();
    grabadora = new MediaRecorder(stream, tipo ? { mimeType: tipo } : undefined);
    grabadora.ondataavailable = (e) => { if (e.data.size) partes.push(e.data); };
    grabadora.onstop = async () => {
      clearTimeout(corte);
      stream.getTracks().forEach(t => t.stop());
      const blob = new Blob(partes, { type: grabadora.mimeType });
      grabadora = null;
      grabar.classList.remove('activo');
      grabar.textContent = '🎤';
      await enviarAudio(blob);
    };
    grabadora.start();
    grabar.classList.add('activo');
    grabar.textContent = '■';
    corte = setTimeout(() => grabadora && grabadora.stop(), MAX_SEGUNDOS * 1000);
  });

  async function enviarAudio(blob) {
    if (!blob.size) return;
    const pendiente = add('user', '…', '🎤 Nota de voz');
    send.disabled = grabar.disabled = true;
    try {
      const datos = new FormData();
      datos.append('audio', blob, 'nota');
      if (sesionId) datos.append('sesionId', sesionId);
      if (telefono.value.trim()) datos.append('telefono', telefono.value.trim());
      const res = await fetch('/api/chat/audio', { method: 'POST', body: datos });
      if (!res.ok) throw new Error(await leerError(res));
      const data = await res.json();
      pendiente.lastChild.textContent = data.transcripcion;
      mostrarRespuesta(data);
    } catch (err) {
      pendiente.lastChild.textContent = '(no se pudo procesar)';
      add('err', 'Error: ' + err.message);
    } finally {
      send.disabled = grabar.disabled = false;
    }
  }
</script>
</body>
</html>
