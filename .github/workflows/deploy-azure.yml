name: Despliegue a Azure

# Se activa al definir la variable del repositorio AZURE_WEBAPP_NAME y los secretos de OIDC
# (AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID). See docs/DEPLOYMENT.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: despliegue-azure
  cancel-in-progress: false

jobs:
  desplegar:
    if: vars.AZURE_WEBAPP_NAME != ''
    runs-on: ubuntu-latest
    environment: produccion
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x

      - name: Pruebas
        run: dotnet test -c Release

      - name: Publicar
        run: dotnet publish src/DpmAgent.Api/DpmAgent.Api.csproj -c Release -o publicar

      - name: Iniciar sesión en Azure (OIDC, sin contraseñas guardadas)
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Desplegar en App Service
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3.0.8
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: publicar
