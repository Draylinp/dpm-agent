name: Despliegue a Azure

# Se activa al definir la variable del repositorio AZURE_WEBAPP_NAME y los secretos de OIDC
# (AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID). See docs/DEPLOYMENT.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: despliegue-azure
  cancel-in-progress: false

jobs:
  desplegar:
    if: vars.AZURE_WEBAPP_NAME != ''
    runs-on: ubuntu-latest
    environment: produccion
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Pruebas
        run: dotnet test -c Release

      - name: Publicar
        run: dotnet publish src/DpmAgent.Api/DpmAgent.Api.csproj -c Release -o publicar

      - name: Iniciar sesión en Azure (OIDC, sin contraseñas guardadas)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Desplegar en App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: publicar
