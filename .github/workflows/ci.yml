name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci_solo_pruebas
          POSTGRES_DB: dpm_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Base desechable del propio job; no es un secreto.
      DPM_TEST_POSTGRES: Host=localhost;Database=dpm_ci;Username=postgres;Password=ci_solo_pruebas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release --verbosity normal
      - name: Banco de evaluación (modelo falso, capa determinista)
        run: dotnet run --project tools/DpmAgent.Eval -c Release --no-build -- --no-escribir
      - name: Docker Compose válido (con y sin el perfil glimmer)
        run: |
          cp .env.example .env
          POSTGRES_PASSWORD=solo-ci docker compose config -q
          POSTGRES_PASSWORD=solo-ci docker compose --profile glimmer config -q
          # La imagen de vLLM del perfil glimmer debe existir (sin descargarla).
          docker manifest inspect "$(grep '^VLLM_IMAGEN=' .env.example | cut -d= -f2)" > /dev/null
      - name: Imagen de Docker
        run: docker build -t dpm-agent:ci .
