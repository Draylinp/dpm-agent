name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Permisos mínimos: el CI solo lee el código.
permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci_solo_pruebas
          POSTGRES_DB: dpm_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dpm_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Base desechable del propio job; no es un secreto.
      DPM_TEST_POSTGRES: Host=localhost;Database=dpm_ci;Username=postgres;Password=ci_solo_pruebas
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # todo el historial, para el escaneo de secretos
      - name: Secretos en todo el historial (gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo" \
            zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --config /repo/.gitleaks.toml --redact --no-banner --exit-code 1
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release --verbosity normal
      - name: Licencias de terceros (THIRD_PARTY_NOTICES.md al día y compatibles con MIT)
        run: python3 scripts/licencias.py --verificar
      - name: Solo datos ficticios (sin nombres reales de ARS, clínicas u hospitales)
        run: python3 scripts/verificar_ficticios.py
      - name: Banco de evaluación (modelo falso, capa determinista)
        run: dotnet run --project tools/DpmAgent.Eval -c Release --no-build -- --no-escribir
      - name: Docker Compose válido (con y sin el perfil glimmer)
        run: |
          cp .env.example .env
          POSTGRES_PASSWORD=solo-ci docker compose config -q
          POSTGRES_PASSWORD=solo-ci docker compose --profile glimmer config -q
          # La imagen de vLLM del perfil glimmer debe existir (sin descargarla).
          docker manifest inspect "$(grep '^VLLM_IMAGEN=' .env.example | cut -d= -f2)" > /dev/null
      - name: PostgreSQL de Docker Compose con TLS
        env:
          POSTGRES_PASSWORD: solo-ci
        run: |
          docker compose up -d db
          # Conexión real por TCP exigiendo TLS (como la app con SSL Mode=Require); espera a que termine de iniciar.
          ok=""
          for i in $(seq 1 60); do
            if docker compose exec -T -e PGPASSWORD=solo-ci -e PGSSLMODE=require db \
                 psql -h localhost -U dpm -d dpm -tAc 'SELECT ssl FROM pg_stat_ssl WHERE pid = pg_backend_pid()' 2>/dev/null | grep -q t; then ok=1; break; fi
            sleep 2
          done
          docker compose logs db | tail -20
          docker compose down -v
          test -n "$ok"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: Accesibilidad (axe-core WCAG 2.1 AA, teclado y tamaño de letra)
        env:
          BaseDatos__Proveedor: Memoria
          Demo__Habilitado: "true"
          Panel__ClaveInicial: clave-solo-ci-123
          # Producción exige llaves de Data Protection persistentes (cifran datos de pacientes).
          DataProtection__Ruta: ${{ runner.temp }}/claves
          ASPNETCORE_URLS: http://127.0.0.1:5199
        run: |
          cd tests/accesibilidad
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          cd ../..
          dotnet run --project src/DpmAgent.Api -c Release --no-build --no-launch-profile > app.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:5199/health/live && break; sleep 1; done
          PANEL_CLAVE=clave-solo-ci-123 BASE_URL=http://127.0.0.1:5199 node tests/accesibilidad/auditar.mjs
      - name: Imagen de Docker
        run: docker build -t dpm-agent:ci .
      - name: Vulnerabilidades de la imagen (Trivy; falla con críticas o altas que tengan arreglo)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa \
            image --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 --no-progress dpm-agent:ci
